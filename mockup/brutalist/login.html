<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JamVote</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo">Jam<span class="accent">Vote</span></a>
            <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')" aria-label="Toggle navigation">///</button>
            <ul class="nav-links">
                <li><a href="index.html">Events</a></li>
                <li><a href="#">About</a></li>
                <li><a href="login.html" class="active">Login</a></li>
                <li><button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">[&#9728;]</button></li>
            </ul>
        </div>
    </nav>

    <div class="container-narrow">
        <div class="login-box">
            <h1>Login</h1>

            <button class="btn-google" onclick="alert('Redirecting to Google OAuth...')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Sign in with Google
            </button>

            <div class="login-divider">or dev mode</div>

            <form onsubmit="event.preventDefault(); alert('Dev login: ' + document.getElementById('dev-username').value);">
                <div class="form-group">
                    <label for="dev-username">Username</label>
                    <input type="text" id="dev-username" class="form-input" placeholder="Enter dev username" autocomplete="off">
                </div>
                <button type="submit" class="btn btn-outline" style="width: 100%; text-align: center;">
                    Dev Login
                </button>
            </form>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-inner">
            <span>&copy; 2026 JamVote</span>
            <span>Built for game jammers</span>
        </div>
    </footer>
    <script>
    (function(){
        var html = document.documentElement;
        var btn = document.getElementById('theme-toggle');
        var saved = localStorage.getItem('theme');
        if (saved === 'dark') html.setAttribute('data-theme', 'dark');
        function update() {
            btn.textContent = html.getAttribute('data-theme') === 'dark' ? '[\u263E]' : '[\u2600]';
        }
        update();
        btn.addEventListener('click', function() {
            var isDark = html.getAttribute('data-theme') === 'dark';
            if (isDark) { html.removeAttribute('data-theme'); localStorage.setItem('theme', ''); }
            else { html.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); }
            update();
        });
    })();
    </script>
</body>
</html>
