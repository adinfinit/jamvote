<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - JamVote</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Nav -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <span class="logo-icon">🎮</span> JamVote
      </a>
      <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">Events</a></li>
        <li><a href="#">About</a></li>
        <li><a href="login.html" class="active">Log In</a></li>
        <li><button class="theme-toggle" id="theme-toggle" title="Toggle dark/light mode" aria-label="Toggle dark/light mode"></button></li>
      </ul>
    </div>
  </nav>

  <div class="container">

    <div class="login-card card">
      <div style="font-size: 3rem; margin-bottom: 12px;">👋</div>
      <div class="greeting">Welcome back!</div>
      <div class="greeting-sub">Log in to vote on games, submit your entry, and join the fun.</div>

      <!-- Google login -->
      <button class="google-btn" onclick="alert('This would redirect to Google OAuth2')">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <!-- Divider -->
      <div class="login-divider">or use dev login</div>

      <!-- Dev form -->
      <form onsubmit="event.preventDefault(); alert('Dev login: ' + this.username.value);">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter any username..." required>
        </div>
        <button type="submit" class="btn btn-golden" style="width: 100%; justify-content: center;">
          🚀 Dev Login
        </button>
      </form>

      <p style="margin-top: 20px; font-size: 0.82rem; color: var(--text-muted);">
        Dev login is only available in development mode.
        <br>In production, use Google to sign in.
      </p>
    </div>

  </div>

  <footer class="footer">
    <p>🎮 JamVote &mdash; Made with love for game jammers everywhere</p>
  </footer>

  <script>
    (function() {
      var toggle = document.getElementById('theme-toggle');
      var html = document.documentElement;
      var stored = localStorage.getItem('jamvote-theme');
      if (stored === 'dark') {
        html.setAttribute('data-theme', 'dark');
      }
      function updateIcon() {
        toggle.textContent = html.getAttribute('data-theme') === 'dark' ? '\u2600' : '\u263E';
      }
      updateIcon();
      toggle.addEventListener('click', function() {
        if (html.getAttribute('data-theme') === 'dark') {
          html.removeAttribute('data-theme');
          localStorage.setItem('jamvote-theme', 'light');
        } else {
          html.setAttribute('data-theme', 'dark');
          localStorage.setItem('jamvote-theme', 'dark');
        }
        updateIcon();
      });
    })();
  </script>

</body>
</html>
