<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - JamVote</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="navbar-brand">JamVote</a>
    <div style="display:flex;align-items:center;gap:0.5rem">
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode"></button>
      <button class="nav-toggle" onclick="document.querySelector('.navbar-links').classList.toggle('open')">&#9776;</button>
    </div>
    <div class="navbar-links">
      <a href="index.html">Home</a>
      <a href="event.html">Events</a>
      <a href="results.html">Results</a>
      <a href="login.html" class="active">Login</a>
    </div>
  </nav>

  <div class="container" style="min-height:calc(100vh - 200px);display:flex;align-items:center;justify-content:center">

    <div class="login-card">
      <div class="login-card-top"></div>
      <div class="login-card-body">

        <h1 style="font-size:1.75rem;font-weight:900;text-align:center;margin-bottom:0.5rem">Welcome Back!</h1>
        <p class="text-center text-muted" style="font-weight:600;margin-bottom:2rem">Sign in to vote on game jam entries</p>

        <!-- Google Login -->
        <button class="google-btn" onclick="alert('Redirecting to Google OAuth...')">
          <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Continue with Google
        </button>

        <div class="divider">or</div>

        <!-- Dev Login -->
        <form onsubmit="event.preventDefault(); alert('Logged in as ' + this.username.value)">
          <div class="form-group">
            <label class="form-label">Username (Dev Mode)</label>
            <input type="text" name="username" class="form-input" placeholder="Enter your username" required>
          </div>
          <button type="submit" class="btn btn--gradient" style="width:100%">Sign In</button>
        </form>

        <p class="text-center text-muted mt-3" style="font-size:0.8rem">
          Dev login is only available in development mode.<br>
          Use Google OAuth in production.
        </p>

      </div>
    </div>

  </div>

  <footer class="footer">
    JamVote &mdash; Making game jams more fun since 2020
  </footer>

  <script>
    (function() {
      var toggle = document.getElementById('theme-toggle');
      var html = document.documentElement;
      function applyTheme(dark) {
        html.setAttribute('data-theme', dark ? 'dark' : 'light');
        toggle.textContent = dark ? '\u2600' : '\u263E';
        localStorage.setItem('jamvote-theme', dark ? 'dark' : 'light');
      }
      var saved = localStorage.getItem('jamvote-theme');
      applyTheme(saved === 'dark');
      toggle.addEventListener('click', function() {
        applyTheme(html.getAttribute('data-theme') !== 'dark');
      });
    })();
  </script>

</body>
</html>
