<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — JamVote</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav__inner">
      <a href="index.html" class="nav__brand">JamVote</a>
      <button class="nav__toggle" onclick="document.querySelector('.nav__links').classList.toggle('open')" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav__links">
        <li><a href="index.html">Events</a></li>
        <li><a href="login.html" class="active">Login</a></li>
        <li><button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme" id="themeBtn"></button></li>
      </ul>
    </div>
  </nav>

  <!-- Login -->
  <section style="min-height: 70vh; display: flex; align-items: center; justify-content: center;">
    <div class="container container--narrow" style="text-align: center; max-width: 400px;">

      <div class="enso" style="margin-bottom: var(--space-lg);"></div>

      <h1 style="font-size: 1.6rem; margin-bottom: var(--space-xs);">Welcome</h1>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: var(--space-lg);">Sign in to vote and submit games.</p>

      <!-- Google Login -->
      <a href="event.html" class="btn btn--full" style="margin-bottom: var(--space-md); display: flex; align-items: center; justify-content: center; gap: var(--space-xs);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0;">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </a>

      <!-- Divider -->
      <div style="display: flex; align-items: center; gap: var(--space-sm); margin: var(--space-md) 0;">
        <div style="flex: 1; height: 1px; background: var(--border-light);"></div>
        <span style="font-size: 0.75rem; color: var(--text-muted); letter-spacing: 0.08em;">DEV MODE</span>
        <div style="flex: 1; height: 1px; background: var(--border-light);"></div>
      </div>

      <!-- Dev Login -->
      <form onsubmit="event.preventDefault(); window.location.href='event.html';">
        <div class="form-group">
          <input type="text" class="form-input" placeholder="Username" style="text-align: center;" value="">
        </div>
        <button type="submit" class="btn btn--full" style="margin-top: var(--space-xs);">Sign in as developer</button>
      </form>

    </div>
  </section>

  <!-- Footer -->
  <footer class="footer" style="margin-top: 0;">
    <div class="container">
      <p>JamVote &middot; Made with stillness</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
