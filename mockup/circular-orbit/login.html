<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - JamVote</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .login-orbit {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      min-height: 70vh;
      justify-content: center;
    }

    .login-central {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, var(--nebula-light), var(--nebula));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 60px var(--glow-blue), 0 0 120px rgba(76, 29, 149, 0.3);
      animation: float 6s ease-in-out infinite;
      padding: 2rem;
      position: relative;
    }

    .login-central h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.75rem;
      letter-spacing: 0.05em;
    }

    .login-central p {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.6);
      margin-bottom: 1rem;
    }

    .google-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.5rem;
      border-radius: 999px;
      background: #fff;
      color: #333;
      font-size: 0.85rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
    }

    .google-btn:hover {
      box-shadow: 0 0 20px rgba(255,255,255,0.3);
      transform: scale(1.05);
      color: #333;
    }

    .google-btn svg {
      width: 18px;
      height: 18px;
    }

    /* Orbiting decorative elements */
    .login-orbit-decoration {
      position: absolute;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      animation: float 6s ease-in-out infinite;
    }

    .dev-form-container {
      max-width: 320px;
      width: 100%;
      text-align: center;
    }

    .dev-form-container h2 {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 1rem;
    }

    .dev-form {
      display: flex;
      gap: 0.5rem;
    }

    /* Orbit SVG behind login */
    .login-orbit-svg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0.3;
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-brand">JamVote</a>
    <ul class="nav-links">
      <li><a href="index.html">Events</a></li>
      <li><a href="login.html" class="active">Login</a></li>
      <li><button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme"></button></li>
    </ul>
  </nav>

  <main class="main">
    <div class="page-container">
      <div class="login-orbit">

        <!-- Decorative orbit rings -->
        <svg class="login-orbit-svg" width="500" height="500" viewBox="0 0 500 500">
          <circle cx="250" cy="250" r="180" fill="none" stroke="var(--orbit-line)" stroke-width="1"/>
          <circle cx="250" cy="250" r="230" fill="none" stroke="var(--orbit-line)" stroke-width="1" stroke-dasharray="4 8"/>
          <!-- Decorative text on orbit -->
          <defs>
            <path id="login-orbit-text" d="M 250,250 m -180,0 a 180,180 0 1,1 360,0 a 180,180 0 1,1 -360,0" />
          </defs>
          <text fill="var(--text-muted)" font-size="9" letter-spacing="6" opacity="0.3">
            <textPath href="#login-orbit-text">WELCOME --- WELCOME --- WELCOME --- WELCOME --- </textPath>
          </text>
        </svg>

        <!-- Small orbiting decorations -->
        <div class="login-orbit-decoration float-delay-1" style="top:10%;left:15%;">
          <span>&#9733;</span>
        </div>
        <div class="login-orbit-decoration float-delay-3" style="top:20%;right:10%;">
          <span>&#9790;</span>
        </div>
        <div class="login-orbit-decoration float-delay-5" style="bottom:25%;left:8%;">
          <span>&#9788;</span>
        </div>

        <!-- Central Login Circle -->
        <div class="login-central">
          <h1>Sign In</h1>
          <p>Join a game jam and start voting</p>
          <a href="event.html" class="google-btn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Sign in with Google
          </a>
        </div>

        <!-- Dev Login (below) -->
        <div class="dev-form-container">
          <h2>Development Login</h2>
          <form class="dev-form" onsubmit="event.preventDefault(); alert('Dev login: ' + this.querySelector('input').value + ' (mockup)');">
            <input type="text" class="form-input" placeholder="Username" required style="flex:1;">
            <button type="submit" class="btn btn-primary" style="padding:0.65rem 1.25rem;font-size:0.85rem;">Login</button>
          </form>
        </div>

      </div>
    </div>
  </main>

  <footer class="footer">
    JamVote &mdash; Circular Orbit Theme &mdash; 2026
  </footer>

  <script src="app.js"></script>
</body>
</html>
