<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - JamVote</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js"></script>
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand">J A M V O T E</a>
      <button class="nav-hamburger" onclick="toggleNav()">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        <li><a href="index.html">Events</a></li>
        <li><a href="event.html">Dashboard</a></li>
        <li><a href="results.html">Results</a></li>
        <li><a href="login.html">Login</a></li>
        <li>
          <span class="flex items-center gap-1">
            <span class="theme-toggle-label">Theme</span>
            <div class="theme-toggle" onclick="toggleTheme()" role="button" tabindex="0" aria-label="Toggle dark mode"></div>
          </span>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Login Content -->
  <div class="login-wrapper">
    <div class="login-card window-card fade-in">
      <div class="window-title-bar">
        <div class="window-dots">
          <span class="window-dot red"></span>
          <span class="window-dot yellow"></span>
          <span class="window-dot green"></span>
        </div>
        <span class="window-title-text">auth://login</span>
      </div>
      <div class="window-body" style="padding:2rem;">

        <h1 class="gradient-text text-center" style="font-size:1.6rem;font-weight:700;margin-bottom:0.5rem;">Welcome Back</h1>
        <p class="text-muted text-center text-small mb-3">Sign in to vote, submit games, and join jams.</p>

        <!-- Google Login -->
        <button class="btn btn-google" style="width:100%;padding:0.75rem;">
          <svg width="18" height="18" viewBox="0 0 18 18" style="margin-right:0.5rem;">
            <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
            <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
            <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.997 8.997 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
            <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
          </svg>
          Sign in with Google
        </button>

        <!-- Divider -->
        <div class="divider">or</div>

        <!-- Dev Login Form -->
        <form onsubmit="event.preventDefault(); window.location.href='event.html';">
          <div class="form-group">
            <label for="dev-username">Development Login</label>
            <input type="text" id="dev-username" placeholder="Enter username..." value="">
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">
            Dev Login
          </button>
        </form>

        <p class="text-muted text-center text-small mt-3" style="font-size:0.78rem;">
          Dev login is only available in development mode.<br>
          Use Google Sign-In for production.
        </p>

      </div>
    </div>
  </div>

  <!-- Vaporwave Grid Footer -->
  <div class="vaporwave-grid">
    <svg class="grid-svg" viewBox="0 0 1200 180" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="footer-text">J A M V O T E &nbsp;&nbsp;&bull;&nbsp;&nbsp; V A P O R W A V E &nbsp;&nbsp;&bull;&nbsp;&nbsp; 2 0 2 6</div>
  </div>

</body>
</html>
