<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - JamVote</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    .login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 60px - 80px);
      padding: 2rem 1rem;
    }
    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 3rem 2.5rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      position: relative;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.06), 0 0 80px rgba(255, 0, 170, 0.04);
    }
    .login-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius-lg);
      padding: 1px;
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(255, 0, 170, 0.15), rgba(139, 92, 246, 0.1));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .login-card h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      text-shadow: var(--glow-cyan);
    }
    .login-card .subtitle {
      color: var(--text-secondary);
      margin-bottom: 2rem;
      font-size: 0.9rem;
      font-family: var(--font-heading);
      letter-spacing: 0.06em;
    }
    .login-divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 2rem 0;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-family: var(--font-heading);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-subtle), transparent);
    }
    .dev-form {
      text-align: left;
    }
    .dev-form label {
      margin-bottom: 0.5rem;
    }
    .dev-form input {
      margin-bottom: 1rem;
    }
    .dev-badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      background: rgba(255, 107, 53, 0.1);
      border: 1px solid rgba(255, 107, 53, 0.3);
      border-radius: 999px;
      color: var(--orange);
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 1rem;
    }
    .google-icon {
      width: 20px;
      height: 20px;
    }
    [data-theme="light"] .login-card {
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }
    [data-theme="light"] .login-card::before {
      background: linear-gradient(135deg, rgba(0, 152, 166, 0.15), rgba(194, 0, 123, 0.1));
    }
    [data-theme="light"] .login-card h1 {
      text-shadow: none;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand flicker">Jam<span>Vote</span></a>
      <button class="navbar-toggle" aria-label="Toggle navigation" onclick="document.querySelector('.navbar-links').classList.toggle('open')">&#9776;</button>
      <ul class="navbar-links">
        <li><a href="index.html">Events</a></li>
        <li><a href="#">About</a></li>
        <li><a href="login.html" class="active">Login</a></li>
        <li><button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme">&#9728;</button></li>
      </ul>
    </div>
  </nav>

  <!-- Login Content -->
  <div class="login-page">
    <div class="login-card">

      <h1 class="text-cyan">Sign In</h1>
      <p class="subtitle">Join the jam. Play. Vote. Win.</p>

      <!-- Google OAuth -->
      <button class="btn-google" style="width:100%;" onclick="alert('Would redirect to Google OAuth')">
        <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>

      <!-- Divider -->
      <div class="login-divider">
        <span>Development Mode</span>
      </div>

      <!-- Dev Login -->
      <div class="dev-badge">Dev Only</div>
      <form class="dev-form" onsubmit="event.preventDefault(); alert('Logged in as ' + this.querySelector('input').value);">
        <label for="dev-username">Username</label>
        <input type="text" id="dev-username" placeholder="Enter a dev username..." required>
        <button type="submit" class="btn btn-purple" style="width:100%;">Login as Developer</button>
      </form>

    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>JamVote &mdash; Built with neon and caffeine. <a href="#">About</a> &bull; <a href="#">GitHub</a></p>
    </div>
  </footer>

  <script src="theme.js"></script>
</body>
</html>
