<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - JamVote</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <span class="gear">&cog;</span> JamVote
      </a>
      <button class="nav-hamburger" id="nav-hamburger">&equiv;</button>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Events</a></li>
        <li><a href="login.html" class="active">Login</a></li>
        <li><button class="theme-toggle" id="theme-toggle">&cog;</button></li>
      </ul>
    </div>
  </nav>

  <!-- Login Content -->
  <div class="login-wrapper">
    <div class="card login-card">
      <span class="rivet-tr"></span>
      <span class="rivet-bl"></span>
      <div class="card-header" style="text-align: center;">
        <h3 style="font-size: 1.3rem;">Enter the Workshop</h3>
      </div>
      <div class="card-body">

        <p style="text-align: center; color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.9rem;">
          Sign in to register for jams, submit games, and cast your votes.
        </p>

        <!-- Google Login -->
        <button class="btn btn-google" style="width: 100%; justify-content: center; padding: 0.8rem; font-size: 1rem;">
          <svg width="18" height="18" viewBox="0 0 18 18" style="flex-shrink: 0;">
            <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/>
            <path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/>
            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.962L3.964 7.294C4.672 5.166 6.656 3.58 9 3.58z"/>
          </svg>
          Sign in with Google
        </button>

        <!-- Divider -->
        <div class="login-divider">
          <span>&cog; Development Mode &cog;</span>
        </div>

        <!-- Dev Login Form -->
        <form onsubmit="event.preventDefault(); window.location.href='event.html';">
          <div class="form-group">
            <label for="dev-username">Username</label>
            <input type="text" id="dev-username" name="username" placeholder="Enter dev username..." autocomplete="off">
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 0.5rem;">
            Enter Workshop
          </button>
        </form>

        <p style="text-align: center; color: var(--text-muted); font-size: 0.75rem; margin-top: 1.5rem;">
          Dev login is only available in development mode.
        </p>

      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      JamVote &mdash; Forged with brass and ingenuity &mdash; 2026
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
