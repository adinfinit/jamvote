<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - JamVote</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- NAV -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">Jam<span>Vote</span></a>
      <button class="nav-hamburger" onclick="toggleNav()" aria-label="Toggle menu">&#9776;</button>
      <ul class="nav-links">
        <li><a href="index.html">Events</a></li>
        <li><a href="event.html">Dashboard</a></li>
        <li><a href="results.html">Results</a></li>
        <li><a href="login.html" class="active">Login</a></li>
        <li><button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">Light</button></li>
      </ul>
    </div>
  </nav>

  <!-- LOGIN -->
  <div class="login-wrapper">
    <div class="login-card">
      <div class="text-center mb-4">
        <h2 style="font-size:2rem;">Sign <span class="text-violet">In</span></h2>
        <p class="mt-1 text-muted" style="font-size:0.85rem;">Join the jam. Vote on games. Celebrate creativity.</p>
      </div>

      <!-- Google OAuth -->
      <a href="#" class="btn btn-primary" style="width:100%;margin-bottom:1rem;display:block;">
        <span>Sign in with Google</span>
      </a>

      <!-- Divider -->
      <div style="display:flex;align-items:center;gap:1rem;margin:1.5rem 0;">
        <div style="flex:1;height:1px;background:var(--border-color);transform:skewY(-2deg);"></div>
        <span class="text-muted" style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.1em;">or dev mode</span>
        <div style="flex:1;height:1px;background:var(--border-color);transform:skewY(2deg);"></div>
      </div>

      <!-- Dev Login -->
      <form onsubmit="event.preventDefault(); window.location.href='event.html';">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" class="form-input" placeholder="Enter your username" value="Alex">
        </div>
        <button type="submit" class="btn btn-outline" style="width:100%;">
          <span>Dev Login</span>
        </button>
      </form>

      <p class="text-center mt-3 text-muted" style="font-size:0.8rem;">
        By signing in you agree to rate games fairly and have fun.
      </p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
