<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - JamVote</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <span class="logo-mark">J</span>
        JamVote
      </a>
      <button class="nav-toggle" onclick="toggleNav()" aria-label="Menu">&#9776;</button>
      <ul class="nav-links">
        <li><a href="index.html">Events</a></li>
        <li><a href="#">About</a></li>
        <li><a href="login.html" class="active">Log in</a></li>
        <li><button id="theme-toggle" aria-label="Toggle theme">&#9790;</button></li>
      </ul>
    </div>
  </nav>

  <main class="page">
    <div class="bento-login">

      <!-- Welcome — Giant text tile -->
      <div class="tile tile-black gl-welcome" style="min-height: 140px; padding: 28px;">
        <div class="tile-flex">
          <div class="tile-label" style="color:rgba(255,255,255,0.4);">Authentication</div>
          <div class="text-giant" style="color:#fff;">WEL<br>COME</div>
        </div>
      </div>

      <!-- Decorative tiles -->
      <div class="tile tile-accent gl-deco1" style="min-height: 60px;">
        <div class="tile-center">
          <div style="font-size: 32px; font-weight: 900;">47</div>
          <div class="text-tiny" style="opacity:0.6;">Active Jammers</div>
        </div>
      </div>

      <div class="tile tile-green gl-deco2" style="min-height: 60px;">
        <div class="tile-center">
          <div style="font-size: 32px; font-weight: 900;">12</div>
          <div class="text-tiny" style="opacity:0.6;">Teams</div>
        </div>
      </div>

      <!-- Login Form Tile -->
      <div class="tile tile-white gl-form" style="min-height: 260px; padding: 28px;">
        <div class="tile-flex">
          <div>
            <div class="text-large" style="margin-bottom: 4px;">Sign In</div>
            <div class="text-body" style="opacity:0.5; margin-bottom: 24px;">Join the jam and start voting</div>
          </div>

          <!-- Google OAuth -->
          <div style="margin-bottom: 24px;">
            <button class="btn-google" onclick="alert('Redirecting to Google OAuth...')">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
              Continue with Google
            </button>
          </div>

          <div style="display:flex; align-items:center; gap:12px; margin-bottom:24px;">
            <div style="flex:1; height:1px; background:rgba(0,0,0,0.1);"></div>
            <span class="text-tiny" style="opacity:0.4;">or dev mode</span>
            <div style="flex:1; height:1px; background:rgba(0,0,0,0.1);"></div>
          </div>

          <!-- Dev Login -->
          <form onsubmit="event.preventDefault(); alert('Dev login: ' + this.username.value);">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter dev username" style="margin-bottom: 16px;">
            <button type="submit" class="btn btn-primary btn-block">Dev Login</button>
          </form>
        </div>
      </div>

      <!-- More decorative tiles -->
      <div class="tile tile-purple gl-deco3" style="min-height: 60px;">
        <div class="tile-center">
          <div class="text-tiny" style="opacity:0.7;">Vote</div>
          <div class="text-large">5</div>
          <div class="text-tiny" style="opacity:0.5;">Aspects</div>
        </div>
      </div>

      <div class="tile tile-warm gl-deco4" style="min-height: 60px;">
        <div class="tile-center">
          <div class="text-tiny" style="opacity:0.5;">Scoring</div>
          <div class="text-medium" style="margin-top:4px;">1&ndash;5</div>
          <div class="text-tiny" style="opacity:0.4;">Scale</div>
        </div>
      </div>

      <div class="tile tile-red gl-deco5" style="min-height: 60px;">
        <div class="tile-center">
          <div style="font-size: 28px;">&#127918;</div>
        </div>
      </div>

      <div class="tile tile-amber gl-deco6" style="min-height: 60px;">
        <div class="tile-center">
          <div style="font-size: 28px;">&#127912;</div>
        </div>
      </div>

      <div class="tile tile-slate gl-deco7" style="min-height: 60px;">
        <div style="display:flex; align-items:center; justify-content:center; height:100%; gap:16px;">
          <div class="text-tiny" style="opacity:0.5;">Create. Submit. Vote. Win.</div>
          <a href="index.html" class="text-tiny" style="opacity:0.7; text-decoration:underline;">Browse Events &rarr;</a>
        </div>
      </div>

    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
