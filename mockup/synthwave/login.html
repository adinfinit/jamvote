<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - JamVote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">JamVote</a>
      <button class="nav-hamburger" aria-label="Toggle menu">&#9776;</button>
      <ul class="nav-links">
        <li><a href="index.html">Events</a></li>
        <li><a href="login.html" class="active">Login</a></li>
        <li>
          <button class="theme-toggle" aria-label="Toggle theme">
            <span class="icon-moon">&#9790;</span>
            <span class="icon-sun">&#9788;</span>
          </button>
        </li>
      </ul>
    </div>
  </nav>

  <div class="container">

    <div class="login-card card card-gradient-border">

      <!-- Synthwave Sun decoration -->
      <div class="synthwave-sun synthwave-sun-lg mb-3"></div>

      <h1 class="text-gradient login-title">Welcome Back</h1>
      <p class="login-subtitle">Sign in to vote on game jam entries</p>

      <!-- Google Login -->
      <button class="btn btn-google login-btn-full">
        <svg width="18" height="18" viewBox="0 0 48 48" style="flex-shrink:0;">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Sign in with Google
      </button>

      <!-- Divider -->
      <div class="login-divider">
        <span>or dev login</span>
      </div>

      <!-- Dev Login Form -->
      <form onsubmit="event.preventDefault(); alert('Dev login: ' + this.username.value);">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" class="form-input" placeholder="Enter dev username" required>
        </div>
        <button type="submit" class="btn btn-primary login-btn-full">
          Dev Login
        </button>
      </form>

      <p class="login-footnote">
        Development mode only. In production, use Google sign-in.
      </p>

    </div>

  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="grid-perspective">
      <div class="grid-horizon"></div>
    </div>
    <div class="footer-content">
      <div class="synthwave-sun mb-2"></div>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="#">About</a>
        <a href="#">Scoring Guide</a>
      </div>
      <p class="footer-text">JamVote &mdash; Game Jam Voting Platform</p>
    </div>
  </footer>

</body>
</html>
