<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - JamVote</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-page {
      min-height: calc(100vh - 56px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    .login-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      transition: background-color 200ms ease;
    }

    .login-header {
      text-align: center;
      margin-bottom: 36px;
    }

    .login-header .logo-icon {
      width: 48px;
      height: 48px;
      background: var(--blue);
      border-radius: var(--radius);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .login-header h1 {
      font-size: 1.5rem;
      margin-bottom: 6px;
    }

    .login-header p {
      font-size: 0.9375rem;
    }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 12px 20px;
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 0.9375rem;
      font-weight: 500;
      color: var(--gray-700);
      cursor: pointer;
      transition: all var(--transition);
    }

    .google-btn:hover {
      background: var(--gray-50);
      border-color: var(--gray-300);
      box-shadow: var(--shadow-sm);
    }

    .google-btn:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .google-logo {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .google-logo svg {
      width: 20px;
      height: 20px;
    }

    .dev-section {
      background: var(--gray-50);
      border-radius: var(--radius);
      padding: 20px;
      transition: background-color 200ms ease;
    }

    .dev-section .form-label {
      color: var(--gray-500);
    }

    .dev-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.6875rem;
      font-weight: 600;
      color: var(--amber-hover);
      background: var(--amber-light);
      padding: 2px 8px;
      border-radius: 99px;
      margin-bottom: 12px;
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.8125rem;
      color: var(--gray-400);
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <span class="logo-icon">J</span>
        JamVote
      </a>
      <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')" aria-label="Menu">&#9776;</button>
      <ul class="nav-links">
        <li><a href="index.html">Events</a></li>
        <li><a href="#">About</a></li>
        <li><a href="login.html" class="active">Log in</a></li>
        <li><button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">&#9790;</button></li>
      </ul>
    </div>
  </nav>

  <!-- Login Page -->
  <div class="login-page">
    <div class="login-card">

      <div class="login-header">
        <div class="logo-icon">J</div>
        <h1>Welcome back</h1>
        <p>Sign in to vote on game jam entries</p>
      </div>

      <!-- Google Login -->
      <button class="google-btn" onclick="window.location.href='event.html'">
        <span class="google-logo">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
        </span>
        Continue with Google
      </button>

      <!-- Divider -->
      <div class="divider-text">or</div>

      <!-- Dev Login -->
      <div class="dev-section">
        <span class="dev-badge">&#9888; Dev Mode</span>
        <form onsubmit="event.preventDefault(); window.location.href='event.html';">
          <div class="form-group mb-12">
            <label class="form-label" for="username">Username</label>
            <input type="text" id="username" class="form-input" placeholder="Enter a dev username" autocomplete="off">
          </div>
          <button type="submit" class="btn btn-secondary btn-block">
            Sign in as dev user
          </button>
        </form>
      </div>

      <div class="login-footer">
        By signing in, you agree to the JamVote terms of service.
      </div>

    </div>
  </div>

  <script src="theme.js"></script>
</body>
</html>
