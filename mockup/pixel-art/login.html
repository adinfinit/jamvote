<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - JamVote</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAV -->
  <nav class="navbar">
    <a href="index.html" class="brand">JAMVOTE</a>
    <button class="nav-hamburger" onclick="toggleNav()">=</button>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">HOME</a></li>
      <li><a href="event.html">EVENTS</a></li>
      <li><a href="login.html" class="active">LOGIN</a></li>
      <li><button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">[DAY]</button></li>
    </ul>
  </nav>

  <div class="login-wrapper">
    <div class="pixel-card card-purple" style="width:100%; max-width:420px;">
      <div class="card-header">
        <span class="card-title">LOGIN TO JAMVOTE</span>
        <span style="font-size:12px;">*</span>
      </div>
      <div class="card-body">

        <div class="text-center mb-24">
          <p class="text-gold" style="font-size:11px;">PLAYER SELECT</p>
          <p class="text-muted" style="font-size:7px;">Choose your login method</p>
        </div>

        <!-- Google Login -->
        <button class="btn btn-secondary btn-block mb-16" onclick="showPixelAlert('Redirecting to Google OAuth...')">
          LOGIN WITH GOOGLE
        </button>

        <hr class="pixel-divider">

        <!-- Dev Login -->
        <div class="mt-16">
          <p class="text-muted mb-8" style="font-size:7px;">DEVELOPMENT MODE</p>
          <div class="form-group">
            <label>USERNAME</label>
            <input type="text" id="dev-username" placeholder="Enter dev username...">
          </div>
          <button class="btn btn-gold btn-block" onclick="showPixelAlert('Dev login as: ' + document.getElementById('dev-username').value)">
            DEV LOGIN
          </button>
        </div>

        <hr class="pixel-divider">

        <div class="text-center mt-16">
          <p class="text-muted" style="font-size:6px;">
            NEW PLAYERS WILL BE PROMPTED<br>TO SET THEIR DISPLAY NAME<br>AFTER FIRST LOGIN.
          </p>
        </div>

      </div>
    </div>
  </div>

  <footer class="footer">
    <p>JAMVOTE &copy; 2026 &mdash; <a href="index.html">HOME</a></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
