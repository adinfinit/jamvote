<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login &mdash; JamVote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo">Jam<span class="accent">Vote</span></a>
            <button class="nav-toggle" aria-label="Toggle navigation">&#9776;</button>
            <ul class="nav-links">
                <li><a href="index.html">Events</a></li>
                <li><a href="#">About</a></li>
                <li><a href="login.html" class="active">Login</a></li>
                <li><button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme"><span>&#9728;</span></button></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="login-container">
            <div class="login-card">
                <div class="deco-fan"></div>
                <h1>Welcome</h1>
                <p class="subtitle">Sign in to cast your votes</p>

                <!-- Google Login -->
                <button class="btn-google" onclick="alert('Redirecting to Google OAuth...')">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Sign in with Google
                </button>

                <div class="login-divider">
                    <span>or</span>
                </div>

                <!-- Dev Login -->
                <form onsubmit="event.preventDefault(); alert('Dev login: ' + this.querySelector('input').value);">
                    <input type="text" class="login-input" placeholder="Developer username" required>
                    <button type="submit" class="btn btn-outline btn-block">Enter as Developer</button>
                </form>

                <div class="deco-line" style="margin-top:2rem;"></div>
                <p style="font-size:0.75rem;color:var(--fg-muted);margin-top:0.75rem;">
                    Dev login is only available in development mode.
                </p>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="deco-line" style="max-width:200px;margin:0 auto 0.75rem;"></div>
        JamVote &copy; 2026 &middot; <a href="#">About</a> &middot; <a href="#">Scoring Guide</a>
    </footer>

    <script src="app.js"></script>
</body>
</html>
