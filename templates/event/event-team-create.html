{{ template "head" . }}

<div class="centered-text">
	<div class="section-header">
		<h1>Create Team</h1>
	</div>

	<div class="card">
		<form method="POST">
			<datalist id="Users">
				{{ range .Users }}
				<option value="{{.Name}}">{{.ID}}</option>
				{{ end }}
			</datalist>

			{{ template "team-fields" . }}
			<input type="submit" value="Save">
		</form>
	</div>
</div>

{{ template "foot" . }}
