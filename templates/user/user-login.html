{{ template "head" . }}

<div class="login-page">
	<div class="login-card card">
		<div class="login-header">
			<h1>Sign in</h1>
			<p class="text-muted">Sign in to vote and participate in game jams.</p>
		</div>

		<div class="logins">
			{{ range .Logins }}
			<a href="{{.URL}}">{{.Title}}</a>
			{{ end }}
		</div>

		{{ if .Development }}
		<div class="divider-text mt-24">or</div>
		<div class="dev-section mt-24">
			<div class="mb-12"><span class="dev-badge">Development</span></div>
			<form action="/auth/development-login" method="POST">
				<div class="field">
					<label for="name">User</label>
					<input type="text" id="name" name="name" value="Admin" class="form-input">
				</div>
				<input type="submit" value="Login">
			</form>
		</div>
		{{ end }}
	</div>
</div>

{{ template "foot" . }}
